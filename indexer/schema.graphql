type Author {
  id: ID! # wallet address
  works: [Work!]! @derivedFrom(field: "author")
  certificates: [Certificate!]! @derivedFrom(field: "owner")
  credits: [Credit!]! @derivedFrom(field: "collaborator")
}

type Work {
  id: ID! # fingerprintHash (bytes32 as hex string)
  fingerprintHash: String!
  ipfsCid: String!
  authenticityScore: BigInt!
  riskLevel: Int! # 0=Low, 1=Medium, 2=High, 3=Blocked
  tokenId: BigInt!
  registeredAt: BigInt! # block timestamp
  txHash: String!
  author: Author!
  certificate: Certificate
  credits: [Credit!]! @derivedFrom(field: "work")
}

type Certificate {
  id: ID! # tokenId as string
  tokenId: BigInt!
  owner: Author!
  ipfsCid: String!
  soulbound: Boolean!
  mintedAt: BigInt!
  txHash: String!
}

type WorkBlockedEvent {
  id: ID! # txHash-logIndex
  author: Author!
  fingerprintHash: String!
  authenticityScore: BigInt!
  blockedAt: BigInt!
  txHash: String!
}

type Credit {
  id: ID! # fingerprintHash-collaborator
  work: Work! # id de Work = fingerprintHash
  fingerprintHash: String!
  author: Author! # quien acreditó (autor de la obra)
  collaborator: Author! # wallet acreditada (Embedded Wallet de Privy)
  bps: Int! # puntos base: 1 = 0,01 %
  creditedAt: BigInt! # block timestamp
  txHash: String!
}